name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: encore
          POSTGRES_PASSWORD: encore
          POSTGRES_DB: encore
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U encore" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    env:
      ENCORE_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.lock
      - run: ruff check .
      - run: mypy crm imports ticketing mock_api console
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
