apiVersion: v1
kind: Service
metadata:
  name: edge
spec:
  selector: {app: edge}
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: edge}
  template:
    metadata:
      labels: {app: edge}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            tcpSocket: {port: 80}
            periodSeconds: 3
          lifecycle:
            preStop:
              exec: {command: [sleep, "5"]}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
      volumes:
        - name: conf
          configMap: {name: edge-nginx}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edge
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: edge}
