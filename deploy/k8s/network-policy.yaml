# Nothing reaches the database or the queue except the application itself.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-and-queue-only-from-app
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [db, redis]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [web, worker, worker-ticketing, beat, migrate]}
---
# Django is reached through the edge, or directly by a Prometheus in the monitoring namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-only-from-edge
spec:
  podSelector:
    matchLabels: {app: web}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: edge}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {port: 8000}
