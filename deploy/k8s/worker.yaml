# Imports get their own workers, so a long import can never hold up ticket sync or check-in delivery.
# An import can outlast any grace period, so it is not asked to finish. It is killed like any other crash: the
# checkpoint is durable, the reaper notices the silence, and the run resumes by itself (ENCORE_IMPORT_AUTO_RESUME).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: encore:local
          imagePullPolicy: IfNotPresent
          command: [celery, -A, encore, worker, --loglevel=info, --concurrency=2, --queues=imports]
          envFrom:
            - configMapRef: {name: encore-config}
            - secretRef: {name: encore-secrets}
          env:
            - {name: DATABASE_URL, value: "postgres://encore:$(POSTGRES_PASSWORD)@db:5432/encore"}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - {name: files, mountPath: /app/data}
      volumes:
        - name: files
          persistentVolumeClaim: {claimName: import-files}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ticketing
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker-ticketing}
  template:
    metadata:
      labels: {app: worker-ticketing}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: encore:local
          imagePullPolicy: IfNotPresent
          command: [celery, -A, encore, worker, --loglevel=info, --concurrency=2, --queues=celery]
          envFrom:
            - configMapRef: {name: encore-config}
            - secretRef: {name: encore-secrets}
          env:
            - {name: DATABASE_URL, value: "postgres://encore:$(POSTGRES_PASSWORD)@db:5432/encore"}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
