# The edge in front of Django. When thousands of people refresh one page, they should not each reach Python.
worker_processes auto;
worker_rlimit_nofile 200000;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    # Each slot costs memory up front, per worker: 25,000 uses about 11 MB and is enough on two cores.
    worker_connections 25000;
    multi_accept on;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 10000;
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 512;

    proxy_cache_path /tmp/edge-cache levels=1:2 keys_zone=edge:20m max_size=200m inactive=1h use_temp_path=off;

    # Re-resolve Django's address, so the edge survives its container being recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream django {
        zone django 64k;
        server web:8000 resolve;
        keepalive 64;
    }

    # Writes and live console data are never cached.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;

    server {
        listen 80 backlog=8192 reuseport;

        # What fans refresh. One second of staleness protects the database from all of them.
        location ~ ^/(events/[^/]+|api/v1/events/[^/]+/availability)$ {
            limit_except GET { deny all; }
            proxy_pass http://django;
            proxy_cache edge;
            proxy_cache_key $uri$is_args$args;
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 3s;
            proxy_cache_lock_age 3s;
            proxy_cache_background_update on;
            # If Django is slow or down, fans keep seeing the last known numbers.
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header Set-Cookie;
            add_header X-Edge-Cache $upstream_cache_status always;
        }

        location /static/ {
            proxy_pass http://django;
            proxy_cache edge;
            proxy_cache_key $uri;
            proxy_cache_valid 200 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Edge-Cache $upstream_cache_status always;
        }

        location / {
            proxy_pass http://django;
        }
    }
}
