[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "encore.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]
# DJ001: NULL means "unknown" here, on purpose. E501: the formatter owns line length.
ignore = ["S101", "DJ001", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S"]
"mock_api/*" = ["S311"]
"imports/management/commands/gen_legacy.py" = ["S311"]
"ticketing/resilience.py" = ["S311"]
"encore/settings.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations/", ".venv/"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "encore.settings"
